name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form as completely as possible.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm these items before submitting the issue.
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have reproduced the issue with the latest version
          required: true
        - label: I have checked the documentation and FAQ
          required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: Describe what should have happened...
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected by this bug?
      options:
        - Document Parser
        - Vector Store (DeepLake)
        - API Server
        - Web Scraper
        - YouTube Processor
        - Configuration
        - Docker Setup
        - Other
      default: 0
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical (system crash, data loss)
        - High (major functionality broken)
        - Medium (feature partially broken)
        - Low (minor issue, workaround available)
      default: 2
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Tell us about your environment
      placeholder: |
        - OS: [e.g., Ubuntu 22.04, macOS 13.0, Windows 11]
        - Python version: [e.g., 3.11.5]
        - Knowledge Ingestor version: [e.g., 1.2.3]
        - Docker version: [if applicable]
        - Browser: [if web-related]
      render: markdown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Please provide any relevant error logs or stack traces
      placeholder: Paste error logs here...
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or files that might help
      placeholder: Any additional information that might be helpful...

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: If you found a workaround, please share it
      placeholder: Describe any workaround you found...