name: Version Management

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Type of version increment'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - patch
          - minor
          - major
      create_tag:
        description: 'Create git tag for the new version'
        required: false
        default: true
        type: boolean

jobs:
  version-increment:
    name: Increment Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.15"
      
      - name: Set up Python
        run: uv python install 3.11
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Get current version
        id: current_version
        run: |
          CURRENT=$(python scripts/version_manager.py current)
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT"
      
      - name: Increment version
        id: new_version
        run: |
          NEW_VERSION=$(python scripts/version_manager.py increment ${{ github.event.inputs.version_type }})
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
      
      - name: Update changelog
        run: |
          DATE=$(date +"%Y-%m-%d")
          VERSION="${{ steps.new_version.outputs.version }}"
          
          # Create changelog entry
          TEMP_FILE=$(mktemp)
          echo "## [$VERSION] - $DATE" > "$TEMP_FILE"
          echo "" >> "$TEMP_FILE"
          echo "### Added" >> "$TEMP_FILE"
          echo "- Version increment to $VERSION" >> "$TEMP_FILE"
          echo "" >> "$TEMP_FILE"
          
          # Prepend to existing changelog
          if [ -f "CHANGELOG.md" ]; then
            # Find the first ## and insert before it
            awk '
              /^## / && !found {
                print "## ['"$VERSION"'] - '"$DATE"'"
                print ""
                print "### Added"
                print "- Version increment to '"$VERSION"'"
                print ""
                found=1
              }
              {print}
            ' CHANGELOG.md > "$TEMP_FILE.new"
            mv "$TEMP_FILE.new" CHANGELOG.md
          else
            mv "$TEMP_FILE" CHANGELOG.md
          fi
      
      - name: Commit version changes
        run: |
          git add VERSION pyproject.toml CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.new_version.outputs.version }}
          
          🤖 Generated with [Claude Code](https://claude.ai/code)
          
          Co-Authored-By: Claude <noreply@anthropic.com>"
      
      - name: Create git tag
        if: github.event.inputs.create_tag == 'true'
        run: |
          git tag -a "v${{ steps.new_version.outputs.version }}" -m "Release v${{ steps.new_version.outputs.version }}"
      
      - name: Push changes
        run: |
          git push origin ${{ github.ref_name }}
          if [ "${{ github.event.inputs.create_tag }}" = "true" ]; then
            git push origin "v${{ steps.new_version.outputs.version }}"
          fi
      
      - name: Create summary
        run: |
          echo "## Version Management Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Previous Version**: ${{ steps.current_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version**: ${{ steps.new_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Increment Type**: ${{ github.event.inputs.version_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Git Tag Created**: ${{ github.event.inputs.create_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Review the updated CHANGELOG.md" >> $GITHUB_STEP_SUMMARY
          echo "- Verify version consistency across files" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.create_tag }}" = "true" ]; then
            echo "- Tag v${{ steps.new_version.outputs.version }} will trigger release workflow" >> $GITHUB_STEP_SUMMARY
          fi