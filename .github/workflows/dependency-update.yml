name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.15"
      
      - name: Set up Python
        run: uv python install 3.11
      
      - name: Update dependencies
        run: |
          # Update UV lock file
          uv sync --upgrade
          
          # Check for outdated dependencies
          uv show --outdated > outdated_deps.txt || true
      
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet uv.lock; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No dependency updates available"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Dependencies updated"
          fi
      
      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore: update dependencies
            
            🤖 Generated with [Claude Code](https://claude.ai/code)
            
            Co-Authored-By: Claude <noreply@anthropic.com>
          title: 'chore: automated dependency updates'
          body: |
            ## Automated Dependency Updates
            
            This PR contains automated dependency updates generated by GitHub Actions.
            
            ### Changes
            - Updated `uv.lock` with latest compatible versions
            - All changes are within semver constraints defined in `pyproject.toml`
            
            ### Testing
            - [ ] CI tests must pass before merging
            - [ ] Security scan must pass
            - [ ] Manual testing if breaking changes detected
            
            ### Notes
            Please review the changes and ensure compatibility before merging.
            
            ---
            *This PR was created automatically. If you have concerns, please review the workflow in `.github/workflows/dependency-update.yml`*
          branch: automated/dependency-updates
          delete-branch: true
          draft: false
          labels: |
            dependencies
            automated
            chore
      
      - name: Enable Pull Request Automerge
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          # Note: This requires branch protection rules and status checks
          # The PR will only auto-merge if all CI checks pass
          echo "Pull request created. Auto-merge will activate after CI passes."

  update-pre-commit:
    name: Update Pre-commit Hooks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install pre-commit
        run: pip install pre-commit
      
      - name: Update pre-commit hooks
        run: |
          pre-commit autoupdate
      
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet .pre-commit-config.yaml; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No pre-commit updates available"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Pre-commit hooks updated"
          fi
      
      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore: update pre-commit hooks
            
            🤖 Generated with [Claude Code](https://claude.ai/code)
            
            Co-Authored-By: Claude <noreply@anthropic.com>
          title: 'chore: update pre-commit hooks'
          body: |
            ## Automated Pre-commit Hook Updates
            
            This PR contains automated updates to pre-commit hooks.
            
            ### Changes
            Updated `.pre-commit-config.yaml` with latest hook versions.
            
            ### Testing
            - [ ] CI tests must pass before merging
            - [ ] Pre-commit hooks must run successfully
            
            ---
            *This PR was created automatically.*
          branch: automated/pre-commit-updates
          delete-branch: true
          draft: false
          labels: |
            pre-commit
            automated
            chore